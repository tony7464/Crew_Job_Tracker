<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f8" />
    <title>Crew Job Tracker</title>
    <script>
      // Apply the saved or system theme before the first paint so the page never
      // flashes the wrong one. Keep in sync with context/ThemeContext.jsx.
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem("theme");
          dark =
            saved === "dark" ||
            (saved !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          dark = false;
        }
        var root = document.documentElement;
        if (dark) root.classList.add("dark");
        root.style.colorScheme = dark ? "dark" : "light";
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", dark ? "#0c1018" : "#f5f6f8");
      })();
    </script>
    <style>
      /* Page background before the stylesheet loads (dev mode injects CSS from JS). */
      html { background: #f5f6f8; }
      html.dark { background: #0c1018; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
